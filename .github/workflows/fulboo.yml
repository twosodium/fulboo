name: Refresh fulboo data

on:
  schedule:
    - cron: "0 5 * * *"   # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch data
        run: node scripts/fetch-fulboo.mjs
        env:
          SPORTAPI_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Commit data
        run: |
          git config user.name "fulboo-bot"
          git config user.email "fulboo-bot@users.noreply.github.com"
          git add data
          git commit -m "refresh data" || echo "no changes"
          git push || echo "nothing to push"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
