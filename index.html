<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>fulboo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root{
    --bg:#060208; --panel:#0a0510; --panel-2:#07030c; --line:rgba(255,255,255,.55); --line-soft:rgba(255,255,255,.16);
    --ink:#ffffff; --muted:#938fc4; --faint:#716a94;
    --accent:#b4273a; --accent-ink:#fff;
    --fresh:#3fd58a; --stale:#e3c23f; --loss:#e0556b;
  }
  *{box-sizing:border-box;border-radius:0}
  html,body{margin:0;height:100%}
  body{color:var(--ink);font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;overflow:hidden;background:#050206}
  a{color:var(--accent);text-decoration:none}

  #bg{position:fixed;inset:0;z-index:-4;pointer-events:none;display:block}
  #stars{position:fixed;top:-45%;left:-45%;width:190%;height:190%;z-index:-3;pointer-events:none;display:block;will-change:transform;transition:transform .09s ease-out}
  .vign{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(130% 95% at 50% 40%, transparent 55%, rgba(0,0,0,.6) 100%)}

  .topcenter{position:fixed;top:0;left:272px;right:268px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:9px;padding:15px 10px 10px;pointer-events:none}
  .topcenter *{pointer-events:auto}
  .back{font-size:14px;color:var(--muted)} .back:hover{color:var(--ink)}
  .word{font-family:"Unbounded",sans-serif;font-weight:900;font-size:24px;letter-spacing:.34em;margin:0;padding-left:.34em;color:#fff;text-align:center}
  .stamp{font-size:12px;color:var(--faint);font-style:italic;line-height:1.35}
  .switcher{display:flex;align-items:center;gap:6px;max-width:100%}
  .navarrow{flex:none;width:26px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-family:"Unbounded",sans-serif;font-size:14px}
  .navarrow:hover{color:var(--ink);border-color:var(--accent)} .navarrow:disabled{opacity:.3;cursor:default}
  .tabs{display:flex;gap:5px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-ms-overflow-style:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;white-space:nowrap;font-family:"Unbounded",sans-serif;font-weight:600;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:7px 12px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--ink);border-color:var(--accent)}
  .tab.active{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

  #net{position:fixed;inset:0}

  .rail{position:fixed;z-index:20;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:0}
  .rail.left{left:0;top:0;bottom:0;width:272px;border-left:none;border-top:none;border-bottom:none}
  .rail.right{right:0;top:0;bottom:0;width:268px;border-right:none;border-top:none;border-bottom:none}
  .sec{padding:13px 15px;border-bottom:1px solid var(--line);flex:none}
  .sec:last-child{border-bottom:none}
  .sec.grow{flex:1;min-height:0;display:flex;flex-direction:column}
  .scroll-y{overflow:auto;min-height:0;flex:1}
  .scroll-y::-webkit-scrollbar{width:7px} .scroll-y::-webkit-scrollbar-thumb{background:var(--line)}
  .sec h4{font-family:"Unbounded",sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;font-variant-caps:all-small-caps;
    color:var(--ink);margin:0 0 11px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex:none}
  .sec h4 span{color:var(--ink);font-weight:600}

  .crestdot{width:15px;height:15px;border-radius:50%;object-fit:contain;flex:none;vertical-align:middle}
  [data-team]{cursor:pointer}
  .actbtn{width:100%;font-family:"Unbounded",sans-serif;font-weight:600;font-size:10.5px;font-variant-caps:all-small-caps;letter-spacing:.05em;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:9px;cursor:pointer;transition:.12s}
  .actbtn:hover{border-color:var(--accent);color:var(--accent)}
  .actbtn.red{background:var(--accent);border-color:var(--accent);color:#fff}
  .actbtn.red:hover{filter:brightness(1.15);color:#fff}
  .toolopt{display:block;width:100%;text-align:left;font-family:"Hanken Grotesk",sans-serif;font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:7px 9px;margin-top:6px;cursor:pointer;transition:.12s}
  .toolopt:hover{color:var(--ink);border-color:var(--accent)}
  .cyc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .beat{color:var(--faint);font-size:10px;font-variant-caps:all-small-caps;letter-spacing:.04em}

  .toggle{display:flex;gap:5px}
  .toggle button{flex:1;min-width:0;font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:0;padding:7px 6px;cursor:pointer;transition:.12s}
  .toggle button:hover{color:var(--ink)} .toggle button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .field label{display:block;font-size:11px;font-variant-caps:all-small-caps;letter-spacing:.04em;color:var(--faint);margin-bottom:4px}
  select,input[type=date]{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:0;color:var(--ink);padding:7px 9px;font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;font-size:13px;outline:none;color-scheme:dark}
  select:focus,input[type=date]:focus{border-color:var(--accent)}
  .dates{display:flex;gap:8px} .dates .field{flex:1;min-width:0}

  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif}
  .tbl th{font-family:"Unbounded",sans-serif;font-weight:600;font-size:10px;font-variant-caps:all-small-caps;letter-spacing:.03em;color:var(--faint);text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
  .tbl th:first-child,.tbl th:nth-child(2){text-align:left}
  .tbl td{padding:5px 6px;border-bottom:1px solid var(--line-soft);color:var(--muted);text-align:right}
  .tbl td.club{text-align:left;color:var(--ink);display:flex;align-items:center;gap:7px;line-height:1.2}
  .tbl td.rank{text-align:left;color:var(--faint)}
  .tbl tr:hover td{background:rgba(180,39,58,.12)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

  .sbox{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:0;color:var(--ink);padding:7px 9px;font-family:inherit;font-size:14px;outline:none;margin-bottom:9px}
  .sbox:focus{border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-family:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;font-size:12px;padding:4px 8px;border-radius:0;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;transition:.12s}
  .chip:hover{color:var(--ink)} .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  #customSec{display:none}

  .ovrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink);padding:5px 0;border-bottom:1px solid var(--line-soft)}
  .ovrow:last-child{border-bottom:none}
  .ovrow b{font-family:"Unbounded",sans-serif;font-weight:600;font-size:12.5px;color:var(--ink)}
  .ovrow .v{text-align:right;max-width:62%;overflow-wrap:anywhere}
  .hint{font-size:12px;color:var(--faint);font-style:italic;line-height:1.4}
  #rightBody{display:flex;flex-direction:column;min-height:0;flex:1;gap:6px}
  .block{flex:1;min-height:0;display:flex;flex-direction:column}
  .block h5{font-family:"Unbounded",sans-serif;font-weight:600;font-size:10px;font-variant-caps:all-small-caps;letter-spacing:.05em;color:var(--ink);margin:0 0 6px;flex:none}
  .dhead{flex:none}
  .mlist{overflow:auto;min-height:0;flex:1}
  .mlist::-webkit-scrollbar{width:7px} .mlist::-webkit-scrollbar-thumb{background:var(--line)}
  .m{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
  .m:last-child{border:none}
  .m .when{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
  .m .row2{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .m .opp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;flex:1;min-width:0;line-height:1.4}
  .tm{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--ink)}
  .m .sc{font-family:"Unbounded",sans-serif;font-weight:600;color:var(--ink)}
  .m .vs{color:var(--faint);font-style:italic}
  .yt{color:var(--accent);font-size:12px;text-decoration:none;line-height:1;flex:none} .yt:hover{color:#ff6b7c}
  .res{width:16px;height:16px;border-radius:0;font-size:9px;font-weight:700;color:#0a0a12;display:inline-flex;align-items:center;justify-content:center;font-family:"Unbounded",sans-serif;flex:none}
  .res.W{background:var(--fresh)} .res.D{background:var(--stale)} .res.L{background:var(--loss)}
  .dnm{font-family:"Unbounded",sans-serif;font-weight:700;font-size:14.5px;margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;line-height:1.3}
  .rec{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:600;font-family:"Unbounded",sans-serif;padding:4px 9px;border-radius:0}
  .pill.w{background:rgba(63,213,138,.16);color:var(--fresh)} .pill.d{background:rgba(227,194,63,.16);color:var(--stale)} .pill.l{background:rgba(224,85,107,.16);color:var(--loss)}
  .flabel{font-family:"Unbounded",sans-serif;font-size:10px;font-variant-caps:all-small-caps;letter-spacing:.05em;color:var(--faint);margin:0 0 6px}
  .form{display:flex;gap:4px;margin-bottom:13px;flex-wrap:wrap}
  .fdot{width:18px;height:18px;border-radius:0;font-size:10px;font-weight:700;color:#0a0a12;display:flex;align-items:center;justify-content:center;font-family:"Unbounded",sans-serif}

  .backbot{display:none}
  /* stacked single-column scroll on phones: graph, then right pane, then left pane */
  @media (max-width:760px){
    html{height:auto}
    body{display:flex;flex-direction:column;height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
    .topcenter{position:static;left:auto;right:auto;order:1;width:100%;padding:16px 16px 12px}
    #net{position:relative;inset:auto;order:2;width:100%;height:70vh;flex:none;border-bottom:1px solid var(--line)}
    .rail{position:static;width:100%;height:auto;border:none}
    .rail.right{order:3;width:100%;border-top:1px solid var(--line)}
    .rail.left{order:4;width:100%;border-top:1px solid var(--line)}
    .sec.grow,.scroll-y,.mlist,#rightBody,.block{flex:none;min-height:0;height:auto;overflow:visible}
    .tbl th{position:static}
    .backtop{display:none}
    .backbot{display:block}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="stars"></canvas><div class="vign"></div>

<div class="topcenter">
  <h1 class="word">fulboo</h1>
  <div class="switcher">
    <button class="navarrow" id="tabPrev" aria-label="previous">&lsaquo;</button>
    <nav class="tabs" id="tabs"></nav>
    <button class="navarrow" id="tabNext" aria-label="next">&rsaquo;</button>
  </div>
</div>
<div id="net"></div>

<aside class="rail left">
  <div class="sec backtop"><a class="back" href="#">&larr; twosodium</a></div>
  <div class="sec" id="seasonSec"><h4>seasons</h4><select id="season"></select></div>
  <div class="sec" id="roundSec" style="display:none">
    <h4>selected teams</h4>
    <select id="round"></select>
    <div class="toggle" id="cupClubs" style="margin-top:10px"><button id="cupNotableBtn" class="on">Clubs with data</button><button id="cupAllBtn">All clubs</button></div>
  </div>
  <div class="sec" id="scopeSec">
    <h4>scope</h4>
    <div class="toggle"><button id="scopeThis" class="on">This competition</button><button id="scopeAll">Across competitions</button></div>
  </div>
  <div class="sec" id="dateSec" style="display:none">
    <h4>match dates</h4>
    <div class="dates"><div class="field"><label>from</label><input type="date" id="start"></div><div class="field"><label>to</label><input type="date" id="end"></div></div>
  </div>
  <div class="sec" id="customSec">
    <h4>your clubs <span id="customCount"></span></h4>
    <input class="sbox" id="sbox" placeholder="Filter clubs…" />
    <div class="chips" id="chips"></div>
  </div>
  <div class="sec" id="toolsSec">
    <button class="actbtn red" id="toolsBtn">Graph tools</button>
    <div id="toolsMenu" style="display:none">
      <button class="toolopt" data-tool="cycle">Random beat-cycle &#8635;</button>
      <button class="toolopt" data-tool="chain">Longest beat-chain</button>
    </div>
  </div>
  <div class="sec grow">
    <h4>standings</h4>
    <div class="scroll-y"><table class="tbl"><thead><tr><th>#</th><th>club</th><th>W</th><th>D</th><th>L</th></tr></thead><tbody id="standings"></tbody></table></div>
  </div>
  <div class="sec backbot"><a class="back" href="#">&larr; twosodium</a></div>
</aside>

<aside class="rail right">
  <div class="sec"><div class="stamp" id="stamp"></div></div>
  <div class="sec"><h4>overview <span id="ovScope"></span></h4><div id="overview"></div></div>
  <div class="sec grow"><div id="rightBody"></div></div>
  <div class="sec backbot"><a class="back" href="#">&larr; twosodium</a></div>
</aside>

<script>
// Normalized competition data loaded from the GitHub Action
const DAY=86400000, NOW=Date.now();
const todayISO=new Date(NOW).toISOString().slice(0,10);
const lastYearISO=new Date(NOW-365*DAY).toISOString().slice(0,10);
let DATA={}, ORDER=[];

// Engine state and helpers
const BALANCE=0.34, SPAWN_ZOOM=1.1, PARALLAX_PAN=0.4, PARALLAX_ZOOM=0.5, GOLDEN=2.399963229728653;
const STAGED=new Set(["cl","el","conf"]);
const hasRounds=()=>current!=="custom"&&DATA[current]&&(DATA[current].type==="cup"||STAGED.has(current));
let current="", customSel=new Set(), scopeMode="this", seasonValue="", startDate=lastYearISO, endDate=todayISO, roundStage="all", cupNotable=true;
let network, nodesDS, edgesDS, lastKey="", _ctx, starBase=null, needRebase=true, pinned=null, notableSet=new Set();
const net=document.getElementById("net"), starsEl=document.getElementById("stars"), rightBody=document.getElementById("rightBody");
const crestCol={};
const allTeamsObj=()=>{const o={};for(const c of Object.values(DATA))Object.assign(o,c.teams);return o;};
const pick=(obj,set)=>{const o={};set.forEach(id=>{if(obj[id])o[id]=obj[id];});return o;};
const seasonsOf=()=>current==="custom"?[]:((DATA[current]&&DATA[current].seasons)||[]);
const isCup=()=>current!=="custom"&&DATA[current]&&DATA[current].type==="cup";
// Stages ordered by first match date
function orderedStages(ms){const first={};for(const m of ms){const s=m.stage||"?";const t=Date.parse(m.date);if(!(s in first)||t<first[s])first[s]=t;}return Object.keys(first).sort((a,b)=>first[a]-first[b]);}
// Most recent stage that has already started
function defaultStage(ms){const st=orderedStages(ms);let def=st[0]||"all";for(const s of st)if(ms.some(m=>(m.stage||"?")===s&&m.date<=todayISO))def=s;return def;}
const yt=(a,b,date)=>`https://www.youtube.com/results?search_query=${encodeURIComponent(`${a} vs ${b} ${new Date(date).getFullYear()} highlights`)}`;
const _cc=document.createElement("canvas"); _cc.width=_cc.height=22;
const _ccx=_cc.getContext("2d",{willReadFrequently:true});

// Most common vivid color inside a crest image
function dominantColor(img){
  try{_ccx.clearRect(0,0,22,22);_ccx.drawImage(img,0,0,22,22);}catch{return null;}
  let data; try{data=_ccx.getImageData(0,0,22,22).data;}catch{return null;}
  const vivid={}, any={};
  for(let i=0;i<data.length;i+=4){
    if(data[i+3]<128)continue;
    const r=data[i],g=data[i+1],b=data[i+2], k=(r>>4)+","+(g>>4)+","+(b>>4);
    any[k]=(any[k]||0)+1;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(mx-mn>38&&mx>45&&mx<248)vivid[k]=(vivid[k]||0)+1;
  }
  const top=o=>{let bk=null,bc=0;for(const k in o)if(o[k]>bc){bc=o[k];bk=k;}return bk;};
  const k=top(vivid)||top(any); if(!k)return null;
  const rgb=k.split(",").map(v=>Math.min(255,(+v)*16+8)), mx=Math.max(...rgb);
  return mx<70?rgb.map(v=>Math.min(255,Math.round(v*70/(mx||1)))):rgb;
}

// Extract and cache crest colors then run done
function loadCrestColors(ids,done){
  const all=allTeamsObj(); let pending=0;
  ids.forEach(id=>{
    if(crestCol[id]!==undefined||!all[id]||!all[id].crest)return;
    crestCol[id]=null; pending++;
    const img=new Image();
    img.onload=()=>{crestCol[id]=dominantColor(img); if(!--pending)done&&done();};
    img.onerror=()=>{if(!--pending)done&&done();};
    img.src=all[id].crest;
  });
  if(!pending)done&&done();
}

// Small crest or color dot for a club
const dotHTML=t=>t&&t.crest?`<img class="crestdot" src="${t.crest}" alt="">`:`<span class="dot" style="background:${t?t.color:"#888"}"></span>`;

// Active date window for shown matches
function computeWindow(across){
  if(across)return {s:Date.parse(startDate),e:Date.parse(endDate)+DAY-1};
  const ss=seasonsOf();
  if(seasonValue.startsWith("last")){const n=+seasonValue.slice(4), oldest=ss[Math.min(n,ss.length)-1]||ss[ss.length-1];return {s:Date.parse(oldest.start),e:Date.parse(todayISO)+DAY-1};}
  const se=ss.find(x=>x.id===seasonValue)||ss[0];
  if(!se)return {s:0,e:Date.parse(todayISO)+DAY-1};
  const endISO=se.end>todayISO?todayISO:se.end;
  return {s:Date.parse(se.start),e:Date.parse(endISO)+DAY-1};
}

// Full season bounds for team membership
function seasonBounds(){
  const ss=seasonsOf();
  if(!ss.length)return {s:0,e:Date.parse(todayISO)+DAY-1};
  if(seasonValue.startsWith("last")){const n=+seasonValue.slice(4), oldest=ss[Math.min(n,ss.length)-1]||ss[ss.length-1];return {s:Date.parse(oldest.start),e:Date.parse(ss[0].end)+DAY-1};}
  const se=ss.find(x=>x.id===seasonValue)||ss[0];
  return {s:Date.parse(se.start),e:Date.parse(se.end)+DAY-1};
}

// Team set defining the visible nodes
function focusTeams(){
  if(current==="custom")return new Set(customSel);
  const sb=seasonBounds(), useRound=hasRounds()&&roundStage!=="all";
  let allow=null;
  if(useRound){const order=orderedStages(DATA[current].matches), i=order.indexOf(roundStage);if(i>=0)allow=new Set(order.slice(i));}
  let f=new Set();
  for(const m of DATA[current].matches){
    const t=Date.parse(m.date); if(t<sb.s||t>sb.e)continue;
    if(allow&&!allow.has(m.stage||"?"))continue;
    f.add(m.home); f.add(m.away);
  }
  if(!f.size&&!useRound)f=new Set(Object.keys(DATA[current].teams));
  if(isCup()&&cupNotable){const n=new Set();f.forEach(id=>{if(notableSet.has(id))n.add(id);});f=n;}
  return f;
}

// Shift starfield with viewport pan and zoom
function placeStars(){
  if(!network||!starBase)return;
  const p=network.getViewPosition(), s=network.getScale();
  starsEl.style.transform=`translate(${((starBase.p.x-p.x)*s*PARALLAX_PAN).toFixed(1)}px,${((starBase.p.y-p.y)*s*PARALLAX_PAN).toFixed(1)}px) scale(${Math.pow(s/starBase.s,PARALLAX_ZOOM).toFixed(3)})`;
}

// Monogram crest for a club
function teamImg(short,color){
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='78' height='78'><defs><radialGradient id='g' cx='34%' cy='28%'><stop offset='0%' stop-color='${color}'/><stop offset='100%' stop-color='${color}' stop-opacity='.68'/></radialGradient></defs><circle cx='39' cy='39' r='35' fill='url(#g)' stroke='rgba(255,255,255,.82)' stroke-width='2'/><text x='39' y='40' font-family='Unbounded,Arial' font-weight='800' font-size='22' fill='#fff' text-anchor='middle' dominant-baseline='central' style='paint-order:stroke;stroke:rgba(0,0,0,.32);stroke-width:3px'>${short}</text></svg>`;
  return "data:image/svg+xml;base64,"+btoa(svg);
}

// Aggregate matches into clubs and directed pairs
function buildModel(teams,matches,filter,win){
  const use=id=>!filter||filter.has(id);
  const rec={}, inW={}, outW={};
  Object.keys(teams).forEach(id=>{if(use(id)){rec[id]={w:0,d:0,l:0,form:[],games:[]};inW[id]=0;outW[id]=0;}});
  const pair={}; let nMatches=0;
  const ms=matches.filter(m=>{if(m.hg==null)return false;const t=Date.parse(m.date);return t>=win.s&&t<=win.e;}).sort((a,b)=>a.date<b.date?-1:1);
  for(const m of ms){
    if(!use(m.home)||!use(m.away))continue;
    nMatches++;
    const w=Math.pow(0.5,((win.e-Date.parse(m.date))/DAY)/win.hl), rH=rec[m.home], rA=rec[m.away];
    const resH=m.hg>m.ag?"W":m.hg<m.ag?"L":"D", resA=m.hg<m.ag?"W":m.hg>m.ag?"L":"D";
    rH.games.push({date:m.date,time:m.time,opp:m.away,gf:m.hg,ga:m.ag,res:resH});
    rA.games.push({date:m.date,time:m.time,opp:m.home,gf:m.ag,ga:m.hg,res:resA});
    const a=m.home<m.away?m.home:m.away, b=m.home<m.away?m.away:m.home, k=a+"|"+b;
    if(!pair[k])pair[k]={a,b,ab:0,ba:0,matches:[]};
    pair[k].matches.push(m);
    if(resH==="W"){(m.home===a?pair[k].ab+=w:pair[k].ba+=w);rH.w++;rA.l++;rH.form.push("W");rA.form.push("L");outW[m.home]+=w;inW[m.away]+=w;}
    else if(resH==="L"){(m.away===a?pair[k].ab+=w:pair[k].ba+=w);rA.w++;rH.l++;rA.form.push("W");rH.form.push("L");outW[m.away]+=w;inW[m.home]+=w;}
    else{rH.d++;rA.d++;rH.form.push("D");rA.form.push("D");}
  }
  const edges=[]; let maxMargin=1e-4, maxVol=1e-4;
  Object.values(pair).forEach(p=>{
    const total=p.ab+p.ba; if(total<=0)return;
    const margin=Math.abs(p.ab-p.ba), contested=(p.ab>0&&p.ba>0&&margin/total<BALANCE);
    maxMargin=Math.max(maxMargin,margin); maxVol=Math.max(maxVol,total);
    let from,to; if(contested||p.ab>=p.ba){from=p.a;to=p.b;}else{from=p.b;to=p.a;}
    edges.push({pairKey:p.a+"|"+p.b,from,to,contested,margin,total});
  });
  return {edges,rec,inW,outW,maxMargin,maxVol,pair,nMatches};
}

// Pin starfield to the current view
function rebaseStars(){
  starBase={p:network.getViewPosition(),s:network.getScale()};
  starsEl.style.transform="translate(0,0) scale(1)"; needRebase=false; placeStars();
}

// Fit the radial layout then rebase starfield
function settleView(){
  if(!needRebase)return;
  network.fit({animation:false});
  const vp=network.getViewPosition(), sc=network.getScale();
  network.moveTo({position:{x:vp.x,y:vp.y},scale:sc*SPAWN_ZOOM});
  rebaseStars();
}

// Place nodes on rings by dominance rank weak at center
function radialPlace(nodes,M){
  const score=id=>(M.outW[id]||0)-(M.inW[id]||0);
  const order=[...nodes].sort((a,b)=>score(a.id)-score(b.id));
  const n=order.length, Rmax=Math.max(340,140*Math.sqrt(n));
  order.forEach((node,j)=>{
    const r=Rmax*Math.sqrt((j+0.5)/n), a=j*GOLDEN;
    node.x=Math.round(Math.cos(a)*r); node.y=Math.round(Math.sin(a)*r);
  });
}

// Hidden anchor node pinning a club to its ring spot
const anchorNode=n=>({id:"_a"+n.id,x:n.x,y:n.y,physics:false,hidden:true});
const anchorSpring=n=>({id:"_s"+n.id,from:n.id,to:"_a"+n.id,hidden:true,physics:true,length:0});

// Build one vis edge styled by winner color and certainty
function edgeObj(x,maxMargin,maxVol){
  const cT=x.margin/(maxMargin||1), wT=x.total/(maxVol||1);
  const col=x.contested?[255,255,255]:(crestCol[x.from]||[150,150,162]);
  const soft=`rgba(${col[0]},${col[1]},${col[2]},${(0.14+0.6*cT).toFixed(2)})`, full=`rgb(${col[0]},${col[1]},${col[2]})`;
  return {id:x.pairKey,from:x.from,to:x.to,color:{color:soft,highlight:full,hover:full},width:+((0.8+3.4*cT)*(0.8+0.4*wT)).toFixed(2),
    dashes:x.contested?[3,7]:false,
    arrows:x.contested?{to:{enabled:true,scaleFactor:.6,type:"arrow"},from:{enabled:true,scaleFactor:.6,type:"arrow"}}:{to:{enabled:true,scaleFactor:.78,type:"arrow"}},
    smooth:{type:"curvedCW",roundness:x.contested?0:0.12}};
}

// Recolor edges once crest colors load
function recolorEdges(){ if(edgesDS&&_ctx)edgesDS.update(_ctx.edges.map(x=>edgeObj(x,_ctx.maxMargin,_ctx.maxVol))); }

// Build graph and all side panels
function render(){
  const isCustom=current==="custom", across=isCustom||scopeMode==="all";
  const focus=focusTeams();
  const teams=pick(isCustom?allTeamsObj():DATA[current].teams,focus);
  let matches;
  if(across){matches=[];for(const c of Object.values(DATA))matches=matches.concat(c.matches);}
  else matches=DATA[current].matches;
  matches=matches.filter(m=>focus.has(m.home)&&focus.has(m.away));
  const w=computeWindow(across), span=Math.max(1,(w.e-w.s)/DAY);
  const win={s:w.s,e:w.e,hl:Math.min(400,Math.max(20,span*0.4))};
  const M=buildModel(teams,matches,focus,win);
  _ctx={teams,matches,win,...M};

  const shown=new Set(); M.edges.forEach(x=>{shown.add(x.from);shown.add(x.to);});
  const nodes=[];
  Object.keys(teams).forEach(id=>{
    if(isCustom){if(!shown.has(id)&&!customSel.has(id))return;}
    else{const r=M.rec[id];if(!r||r.w+r.d+r.l===0)return;}
    const dom=(M.outW[id]||0)-(M.inW[id]||0), fallback=teamImg(teams[id].short,teams[id].color), crest=teams[id].crest;
    nodes.push({id,shape:crest?"circularImage":"image",image:crest||fallback,brokenImage:fallback,size:30+Math.max(0,dom)*6,label:teams[id].name,
      font:{color:"#ffffff",face:"Hanken Grotesk",size:14,strokeWidth:3,strokeColor:"#040309",background:"rgba(5,3,10,0.68)",vadjust:3}});
  });
  const visEdges=M.edges.map(x=>edgeObj(x,M.maxMargin,M.maxVol));
  const need=[]; M.edges.forEach(x=>{if(!x.contested&&crestCol[x.from]===undefined)need.push(x.from);});
  if(need.length)loadCrestColors(need,recolorEdges);
  radialPlace(nodes,M);
  const allNodes=nodes.concat(nodes.map(anchorNode)), allEdges=visEdges.concat(nodes.map(anchorSpring));
  const key=nodes.map(n=>n.id).sort().join(",");
  const opts={physics:{barnesHut:{gravitationalConstant:-3200,centralGravity:0,springLength:0,springConstant:0.055,damping:0.5,avoidOverlap:0.3},stabilization:{iterations:130}},edges:{physics:false},interaction:{hover:true,tooltipDelay:1e9,hideEdgesOnDrag:false},nodes:{borderWidth:0,color:{background:"rgba(0,0,0,0)",border:"rgba(0,0,0,0)",highlight:{background:"rgba(0,0,0,0)",border:"rgba(0,0,0,0)"},hover:{background:"rgba(0,0,0,0)",border:"rgba(0,0,0,0)"}},chosen:{label:false,node:(v,id,sel,hov)=>{if(hov)v.size*=1.45;}}}};
  if(!network){
    nodesDS=new vis.DataSet(allNodes); edgesDS=new vis.DataSet(allEdges);
    network=new vis.Network(net,{nodes:nodesDS,edges:edgesDS},opts);
    network.on("hoverNode",p=>renderNode(p.node));
    network.on("hoverEdge",p=>renderEdge(p.edge));
    network.on("blurNode",restore); network.on("blurEdge",restore);
    network.on("click",p=>{
      recolorEdges();
      if(p.nodes.length){pinned={t:"n",id:p.nodes[0]};renderNode(p.nodes[0]);}
      else if(p.edges.length){pinned={t:"e",id:p.edges[0]};renderEdge(p.edges[0]);}
      else{pinned=null;renderRightDefault();}
    });
    network.on("dragging",placeStars); network.on("zoom",placeStars); network.on("dragEnd",placeStars);
    network.on("stabilizationIterationsDone",settleView);
  } else if(key===lastKey){
    nodesDS.update(nodes.map(n=>({id:n.id,size:n.size})).concat(nodes.map(anchorNode)));
    edgesDS.update(visEdges);
  } else {
    needRebase=true;
    nodesDS.clear(); nodesDS.add(allNodes); edgesDS.clear(); edgesDS.add(allEdges); network.stabilize();
  }
  lastKey=key; pinned=null;
  renderStandings(teams,M); renderOverview(teams,M); renderRightDefault();
}

// Directed beats graph from decisive edges
function beatsAdj(){const adj={}; if(_ctx)_ctx.edges.forEach(x=>{if(!x.contested)(adj[x.from]=adj[x.from]||[]).push(x.to);});return adj;}

// Find a random beat cycle in the graph
function findCycle(){
  const adj=beatsAdj(), tri=[];
  for(const a in adj)for(const b of adj[a]){if(!adj[b])continue;for(const c of adj[b])if(c!==a&&a!==b&&b!==c&&adj[c]&&adj[c].includes(a))tri.push([a,b,c]);}
  if(tri.length)return tri[Math.floor(Math.random()*tri.length)];
  const nodes=Object.keys(adj);
  for(let t=0;t<400;t++){
    let cur=nodes[Math.floor(Math.random()*nodes.length)]; const start=cur, path=[cur], seen=new Set([cur]);
    for(let s=0;s<14;s++){
      const outs=adj[cur]; if(!outs||!outs.length)break;
      const nx=outs[Math.floor(Math.random()*outs.length)];
      if(nx===start&&path.length>=3)return path;
      if(seen.has(nx))break;
      seen.add(nx); path.push(nx); cur=nx;
    }
  }
  return null;
}

// Longest beat chain via randomized walks
function longestChain(){
  const adj=beatsAdj(), nodes=Object.keys(adj); if(!nodes.length)return null;
  let best=[];
  for(let t=0;t<5000;t++){
    let u=nodes[Math.floor(Math.random()*nodes.length)]; const path=[u], seen=new Set([u]);
    while(true){const outs=(adj[u]||[]).filter(v=>!seen.has(v)); if(!outs.length)break; u=outs[Math.floor(Math.random()*outs.length)]; seen.add(u); path.push(u);}
    if(path.length>best.length)best=path;
  }
  return best.length>=2?best:null;
}

// Emphasize sequence edges and dim the rest
function emphasize(set){
  edgesDS.update(_ctx.edges.map(x=>{
    const e=edgeObj(x,_ctx.maxMargin,_ctx.maxVol);
    if(set.has(x.pairKey)){const col=x.contested?"255,255,255":(crestCol[x.from]||[150,150,162]).join(",");e.width=+e.width+6;e.color={color:`rgb(${col})`,highlight:`rgb(${col})`,hover:`rgb(${col})`};}
    else{const faint="rgba(120,122,140,0.05)";e.color={color:faint,highlight:faint,hover:faint};}
    return e;
  }));
}

  for(let i=0;i<lim;i++)pairs.push([ids[i],ids[(i+1)%n]]);

// Build custom club chips
function buildChips(){
  const box=document.getElementById("chips"),all=allTeamsObj(),q=document.getElementById("sbox").value.toLowerCase();
  document.getElementById("customCount").textContent=customSel.size+" picked";
  box.innerHTML="";
  Object.keys(all).filter(id=>all[id].name.toLowerCase().includes(q)).forEach(id=>{
    const c=document.createElement("button");c.className="chip"+(customSel.has(id)?" on":"");c.textContent=all[id].name;
    c.onclick=()=>{customSel.has(id)?customSel.delete(id):customSel.add(id);buildChips();render();};box.appendChild(c);});
}
document.getElementById("sbox").oninput=buildChips;

// Draw random red to black field once
(function(){
  const cv=document.getElementById("bg"), g=cv.getContext("2d");
  function draw(){
    const dpr=devicePixelRatio||1, W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr;
    cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
    g.fillStyle="#050206"; g.fillRect(0,0,W,H);
    const n=11+((Math.random()*6)|0);
    for(let i=0;i<n;i++){
      const x=Math.random()*W, y=Math.random()*H, R=(200+Math.random()*460)*dpr, t=Math.random();
      const r=Math.round(40+t*185), col=`rgba(${r},${Math.round(r*0.1)},${Math.round(r*0.15)},`;
      const grad=g.createRadialGradient(x,y,0,x,y,R);
      grad.addColorStop(0,col+(0.26*t+0.05).toFixed(2)+")"); grad.addColorStop(1,col+"0)");
      g.fillStyle=grad; g.beginPath(); g.arc(x,y,R,0,7); g.fill();
    }
  }
  draw(); addEventListener("resize",draw);
})();

// Draw starfield once
(function(){
  const cv=starsEl, g=cv.getContext("2d");
  const TINTS=["255,255,255","255,205,210","255,180,175","255,225,195"];
  function draw(){
    const dpr=devicePixelRatio||1, cw=cv.clientWidth||innerWidth, ch=cv.clientHeight||innerHeight;
    const W=cv.width=cw*dpr, H=cv.height=ch*dpr; g.clearRect(0,0,W,H);
    const n=Math.round(cw*ch/6800);
    for(let i=0;i<n;i++){const x=Math.random()*W,y=Math.random()*H,r=(Math.random()*1.1+0.3)*dpr,a=Math.random()*0.5+0.07;const t=Math.random()<0.8?TINTS[0]:TINTS[1+((Math.random()*3)|0)];g.fillStyle=`rgba(${t},${a.toFixed(2)})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
    for(let i=0;i<9;i++){const x=Math.random()*W,y=Math.random()*H,r=(Math.random()*1.4+1.3)*dpr;const grad=g.createRadialGradient(x,y,0,x,y,r*6);grad.addColorStop(0,"rgba(201,206,255,.5)");grad.addColorStop(1,"rgba(201,206,255,0)");g.fillStyle=grad;g.beginPath();g.arc(x,y,r*6,0,7);g.fill();g.fillStyle="rgba(255,255,255,.85)";g.beginPath();g.arc(x,y,r*0.7,0,7);g.fill();}
  }
  draw(); addEventListener("resize",draw);
})();

// Load data then start
async function init(){
  const get=u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();});
  try{
    const man=await get("data/manifest.json");
    await Promise.all(man.competitions.map(async c=>{DATA[c.code]=await get(`data/${c.code}.json`);}));
    ORDER=man.competitions.filter(c=>DATA[c.code]).map(c=>[c.code,DATA[c.code].name||c.name]);
    ORDER.push(["custom","Custom view"]);
    notableSet=new Set();
    for(const c of Object.values(DATA)) if(c.type!=="cup") Object.keys(c.teams).forEach(id=>notableSet.add(id));
    current=ORDER[0][0];
    seasonValue=(seasonsOf()[0]||{}).id||"";
    roundStage=hasRounds()?defaultStage(DATA[current].matches):"all";
    document.getElementById("stamp").textContent=`Data last refreshed ${new Date(man.updated).toISOString().slice(11,16)} UTC. All times in UTC.`;
    buildTabs(); fillSeasons(); updateControls(); render();
  }catch(e){
    document.getElementById("stamp").textContent="No data yet. Run the GitHub Action.";
    document.getElementById("overview").innerHTML='<p class="hint">Data has not been generated yet. Run the "Refresh fulboo data" workflow in the repo\'s Actions tab, then reload.</p>';
  }
}
init();
</script>
